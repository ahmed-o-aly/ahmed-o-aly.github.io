name: Axe accessibility testing

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/run-axe.mjs"
      - "assets/**"
      - "_bibliography/**"
      - "_includes/**"
      - "_layouts/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "_sass/**"
      - "**.html"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        path:
          - ""
          - "projects/"
          - "projects/metahub-ai-xr-lab/"
          - "projects/abu-dhabi-urban-dynamics/"
          - "blog/"
          - "blog/2026/what-i-am-building-this-site-for/"
          - "books/"
          - "books/the_godfather/"
          - "about/"
          - "cv/"
          - "publications/"
          - "404.html"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Prepare build config
        run: |
          ruby -ryaml -e 'config = YAML.load_file("_config.yml"); config["giscus"] ||= {}; config["giscus"]["repo"] = ENV.fetch("GITHUB_REPOSITORY"); config["baseurl"] = ""; File.write("_config.yml", config.to_yaml)'

      - name: Install and build
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --upgrade pip
          python -m pip install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build --trace

      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run axe
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npm install axe-core chrome-remote-interface http-server
          npx http-server _site/ &
          node .github/scripts/run-axe.mjs "http://127.0.0.1:8080/${{ matrix.path }}" 1500
