name: Publish scheduled posts

on:
  schedule:
    # Runs at 00:00 Asia/Dubai.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-posts
  cancel-in-progress: false

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set publish date
        run: echo "TODAY=$(TZ=Asia/Dubai date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Move scheduled posts into _posts
        run: |
          echo "Publishing scheduled posts for $TODAY"
          shopt -s nullglob
          for file in _scheduled/${TODAY}-*.md; do
            echo "Found scheduled post: $file"
            mv "$file" "_posts/"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/ _scheduled/
          if git diff --cached --quiet; then
            echo "No scheduled posts to publish"
            exit 0
          fi
          git commit -m "Publish scheduled posts for $TODAY"
          git push
