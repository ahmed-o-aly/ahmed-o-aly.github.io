- title: Institutions, incentives, and power
  summary: Books that sharpen how hierarchy, legitimacy, governance, and designed worlds behave under pressure.
  examples:
    - Dune
    - The Will of the Many
    - The Well of Ascension

- title: Training, competence, and obligation
  summary: Stories about apprenticeship, craft, loyalty, and the cost of becoming useful inside demanding systems.
  examples:
    - Assassin's Apprentice
    - The Name of the Wind
    - The Way of Shadows

- title: Systems under stress
  summary: Reads that keep circling collapse, repair, revolt, feedback, and what happens after power changes hands.
  examples:
    - Golden Son
    - Rhythm of War
    - Lost Islamic History
