- date: "28 Aug"
  text: "A portfolio is a model too: it selects what to preserve, what to expose, and what to leave unresolved."
- date: "20 Aug"
  text: "The quiet part of lab readiness is making every impressive system boringly dependable."
- date: "07 Aug"
  text: "Every optimization problem begins as an argument about what deserves to count."
- date: "24 Jul"
  text: "A simulation is most useful just before everyone agrees too quickly."
- date: "11 Jul"
  text: "Good research software leaves a trail another person can actually follow."
- date: "26 Jun"
  text: "The model solved. The meeting did not. Both outcomes were informative."
- date: "09 Jun"
  text: "A lab becomes real when the second session is less heroic than the first."
